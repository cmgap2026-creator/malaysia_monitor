name: Malaysia Monitor Auto Scraper

on:
  schedule:
    # 每 5 分钟触发一次
    - cron: '*/5 * * * *'
  workflow_dispatch: # 允许手动点击按钮触发测试

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v3

      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.10'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install selenium beautifulsoup4 deep-translator psutil requests

      - name: Run Scraper Script
        # 【注意】如果你的 Python 脚本名字不叫这个，请把下面这行改掉！
        run: python monitor_malaysia.py

      - name: Commit and Push changes
        run: |
          git config --local user.email "action@github.com"
          git config --local user.name "GitHub Action"
          git add items_malaysia.json index.html
          git commit -m "Auto-update Malaysia monitor data [skip ci]" || echo "No changes to commit"
          git push
