name: Malaysia Monitor Auto Scraper

on:
  schedule:
    - cron: '*/5 * * * *'
  workflow_dispatch: 

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v3

      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.10'

      - name: Install dependencies (包含虚拟显示器组件)
        run: |
          # 🚨 姬姬姐姐的重点修改：安装 Ubuntu 系统的虚拟屏幕底座 xvfb
          sudo apt-get update
          sudo apt-get install -y xvfb
          
          python -m pip install --upgrade pip
          # 🚨 增加了 pyvirtualdisplay 这个库
          pip install selenium beautifulsoup4 deep-translator psutil requests pyvirtualdisplay

      - name: Run Scraper Script
        run: python malaysia_monitor.py

      - name: Commit and Push changes
        run: |
          git config --local user.email "action@github.com"
          git config --local user.name "GitHub Action"
          git add items_malaysia.json index.html
          git commit -m "Auto-update Malaysia monitor data [skip ci]" || echo "No changes to commit"
          git push
